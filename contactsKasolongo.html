<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Contact Kasolongo Primary School." />
    <title>Contact Kasolongo Primary School</title>
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <nav>
      <a href="index.html">Home</a>
      <a href="aboutUs.html">About Us</a>
      <a href="performance.html">Performance</a>
      <a href="contactsKasolongo.html">Contacts</a>
      <a href="newStudent.html">New Student</a>
    </nav>

    <main>
      <h1>We would like to hear from you</h1>
      <form method="post" action="#">
        <fieldset>
          <legend>Contact details</legend>
          <p>
            <label for="FirstName">First Name:</label
            ><input
              type="text"
              name="FirstName"
              id="FirstName"
              autocomplete="name"
              required
            />
          </p>
          <p>
            <label for="LastName">Last Name:</label
            ><input
              type="text"
              name="LastName"
              id="LastName"
              autocomplete="name"
              required
            />
          </p>
          <p>
            <label for="email">Email:</label
            ><input
              type="email"
              name="email"
              id="email"
              autocomplete="email"
              placeholder="example@gmail.com"
              required
            />
          </p>
          <p>
            <label for="phone">Phone</label
            ><input
              type="tel"
              name="phone"
              id="phone"
              autocomplete="tel"
              placeholder="+254712345678"
              required
            />
          </p>
          <p>
            <label for="message">Message</label
            ><textarea
              name="message"
              id="message"
              rows="5"
              placeholder="Type your message here"
              required
            ></textarea>
          </p>
        </fieldset>

        <fieldset>
          <legend>Contact preference</legend>
          <p>Please choose your preferred contact method:</p>
          <p>
            <input
              type="radio"
              name="preference"
              id="preference_phone"
              value="phone"
              required
            /><label for="preference_phone">Phone</label>
          </p>
          <p>
            <input
              type="radio"
              name="preference"
              id="preference_email"
              value="email"
            /><label for="preference_email">Email</label>
          </p>
        </fieldset>

        <fieldset>
          <legend>Time preference</legend>
          <p>Please choose a suitable time to be contacted:</p>
          <p>
            <input
              type="radio"
              name="time"
              id="time_morning"
              value="morning"
              required
            /><label for="time_morning">Morning</label>
          </p>
          <p>
            <input
              type="radio"
              name="time"
              id="time_afternoon"
              value="afternoon"
            /><label for="time_afternoon">Afternoon</label>
          </p>
          <p>
            <input
              type="radio"
              name="time"
              id="time_evening"
              value="evening"
            /><label for="time_evening">Evening</label>
          </p>
        </fieldset>

        <button type="submit">Send message</button>
        <button type="reset">Clear</button>
      </form>
    </main>
  </body>
</html>
